<!-- This is a placeholder for NDVI sample image -->
<!-- You can replace this with an actual NDVI map image -->
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f0f9ff"/>
  
  <!-- Field boundary -->
  <polygon points="50,50 350,80 320,250 80,220" fill="#dcfce7" stroke="#374151" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- High vigor areas (green) -->
  <polygon points="50,50 200,60 180,150 70,140" fill="#22c55e" opacity="0.8"/>
  
  <!-- Moderate vigor areas (light green) -->
  <polygon points="200,60 350,80 300,180 180,150" fill="#84cc16" opacity="0.8"/>
  
  <!-- Low vigor areas (yellow) -->
  <polygon points="70,140 180,150 160,210 90,200" fill="#eab308" opacity="0.8"/>
  
  <!-- Stressed areas (red) -->
  <polygon points="300,180 320,250 200,240 180,200" fill="#ef4444" opacity="0.8"/>
  
  <!-- Analysis points -->
  <circle cx="100" cy="100" r="3" fill="#1f2937"/>
  <circle cx="160" cy="105" r="3" fill="#1f2937"/>
  <circle cx="220" cy="110" r="3" fill="#1f2937"/>
  <circle cx="280" cy="115" r="3" fill="#1f2937"/>
  <circle cx="110" cy="150" r="3" fill="#1f2937"/>
  <circle cx="170" cy="155" r="3" fill="#1f2937"/>
  <circle cx="230" cy="160" r="3" fill="#1f2937"/>
  <circle cx="290" cy="165" r="3" fill="#1f2937"/>
  <circle cx="120" cy="200" r="3" fill="#1f2937"/>
  <circle cx="180" cy="205" r="3" fill="#1f2937"/>
  <circle cx="240" cy="210" r="3" fill="#1f2937"/>
  <circle cx="300" cy="215" r="3" fill="#1f2937"/>
  
  <!-- Legend -->
  <rect x="20" y="20" width="100" height="80" fill="white" opacity="0.9" rx="5"/>
  <text x="25" y="35" font-family="Arial" font-size="12" font-weight="bold">NDVI Scale</text>
  <rect x="25" y="40" width="60" height="10" fill="url(#ndviGradient)"/>
  <text x="25" y="60" font-family="Arial" font-size="10">0.0</text>
  <text x="80" y="60" font-family="Arial" font-size="10">1.0</text>
  <text x="25" y="75" font-family="Arial" font-size="10">Low</text>
  <text x="65" y="75" font-family="Arial" font-size="10">High</text>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="ndviGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
</svg>